[workspace]
resolver = "3"
members = ["crates/cabal-engine", "crates/cabal-wasm", "crates/cabal-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Karthik Subramanian <winnerkarthik07@gmail.com>"]
repository = "https://github.com/KarthikSubramanian07/Cabal"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Size-optimised profile used for the wasm artifact
[profile.wasm]
inherits = "release"
opt-level = "z"
