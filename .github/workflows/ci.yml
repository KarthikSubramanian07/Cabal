name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_SIZE_BUDGET_BYTES: 409600

jobs:
  rust:
    name: "Rust: fmt, clippy, tests, DATC"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: DATC report
        run: cargo run -p cabal-cli -- datc --report

  bench:
    name: "Bench: opening adjudication gate"
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CRITERION_HOME: ${{ github.workspace }}/target/criterion
      BENCH_ARGS: --sample-size 30 --measurement-time 3 --warm-up-time 1 --noplot ^adjudicate.spring.1901
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      # Base and head run back to back on the same runner; comparing against a
      # number recorded on another machine would gate on hardware, not code.
      - name: Bench the base commit
        run: |
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null && git worktree add -q ../base "$BASE_SHA" \
            && test -f ../base/crates/cabal-engine/benches/adjudicate.rs; then
            (cd ../base && cargo bench -p cabal-engine --bench adjudicate -- --save-baseline before $BENCH_ARGS)
          else
            echo "no benchable base commit; the recorded baseline will be used"
          fi
      - name: Bench this commit
        run: cargo bench -p cabal-engine --bench adjudicate -- --baseline-lenient before $BENCH_ARGS
      - name: Fail on a regression over 30 percent
        run: python3 tools/check-bench-regression.py --against before

  wasm:
    name: WASM build and size gate
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: wasm-pack build crates/cabal-wasm --target web --release --out-dir ../../packages/engine/pkg --out-name cabal_engine
      - name: Size gate
        run: |
          size=$(gzip -c packages/engine/pkg/cabal_engine_bg.wasm | wc -c | tr -d ' ')
          echo "gzip size: $size bytes (budget $WASM_SIZE_BUDGET_BYTES)"
          test "$size" -le "$WASM_SIZE_BUDGET_BYTES"
      - uses: actions/upload-artifact@v7
        with:
          name: engine-pkg
          path: packages/engine/pkg
          retention-days: 7

  node:
    name: "Node: typecheck, lint, unit, workerd"
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: engine-pkg
          path: packages/engine/pkg
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: engine-pkg
          path: packages/engine/pkg
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cabal/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
