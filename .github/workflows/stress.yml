name: Stress

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proptest-long:
    name: Property tests, large budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: PROPTEST_CASES=20000 cargo test -p cabal-engine --release -- prop_

  fuzz:
    name: Fuzz ${{ matrix.target }} (600 seconds)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [parser, movement]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          key: fuzz-${{ matrix.target }}
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600 -max_len=4096
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
